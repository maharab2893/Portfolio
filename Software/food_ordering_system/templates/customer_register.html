{% extends "base.html" %}
{% block title %}Sign Up — FreshTicket{% endblock %}
{% block content %}
<div class="card form-narrow">
  <h2>Create your account</h2>
  <form method="POST">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" required>

    <label for="address">Delivery address</label>
    <input type="text" id="address" name="address" required>

    <label for="phone">Phone number</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="6">

    <button class="btn btn-accent btn-block" type="submit">Sign up</button>
  </form>
  <p class="muted" style="margin-top:14px;">Already have an account?
    <a href="{{ url_for('customer_login') }}">Log in</a></p>
</div>
{% endblock %}
